name: Python application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest cachetools flask flask-cors python-dotenv google-generativeai google-auth-oauthlib google-api-python-client requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Pytest Test Suite
      env:
        # Dummy keys so tests don't fail due to missing env variables
        GEMINI_API_KEY: "mock_key"
        GOOGLE_CIVIC_API_KEY: "mock_key"
        GOOGLE_OAUTH_CLIENT_ID: "mock_key"
        GOOGLE_OAUTH_CLIENT_SECRET: "mock_key"
        FLASK_SECRET_KEY: "mock_key"
      run: |
        pytest tests/ -v
